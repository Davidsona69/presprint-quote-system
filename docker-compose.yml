services:
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: presprint
      POSTGRES_PASSWORD: presprint
      POSTGRES_DB: presprint_quotes
    volumes:
      - db_data:/var/lib/postgresql/data
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U presprint -d presprint_quotes"]
      interval: 5s
      timeout: 5s
      retries: 5

  backend:
    build: ./backend
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    environment:
      DATABASE_URL: postgresql+asyncpg://presprint:presprint@db:5432/presprint_quotes
      ENVIRONMENT: development
    ports:
      - "8000:8000"
    volumes:
      - ./backend:/app   # live-reload friendly for dev; remove for prod image

  frontend:
    image: nginx:alpine
    restart: unless-stopped
    depends_on:
      - backend
    volumes:
      - ./frontend:/usr/share/nginx/html:ro
    ports:
      - "8080:80"

  # Reverse proxy for prod deployment (Week 7). Not needed for local dev —
  # the frontend/backend ports above are already reachable directly.
  nginx-proxy:
    image: nginx:alpine
    restart: unless-stopped
    profiles: ["prod"]
    depends_on:
      - backend
      - frontend
    volumes:
      - ./infra/nginx.conf:/etc/nginx/nginx.conf:ro
    ports:
      - "80:80"
      - "443:443"

volumes:
  db_data:
