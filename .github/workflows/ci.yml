name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test-backend:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: presprint
          POSTGRES_PASSWORD: presprint
          POSTGRES_DB: presprint_quotes
        ports: ["5432:5432"]
        options: >-
          --health-cmd pg_isready
          --health-interval 5s
          --health-timeout 5s
          --health-retries 5

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        working-directory: backend
        run: pip install -r requirements.txt

      - name: Run tests
        working-directory: backend
        env:
          DATABASE_URL: postgresql+asyncpg://presprint:presprint@localhost:5432/presprint_quotes
        run: pytest tests/ -v

  # Add a deploy job here in Week 7 once you have a target server/registry.
  # Typical shape: build + push Docker image, then SSH/webhook to pull & restart
  # on the deployment host.
