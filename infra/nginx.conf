events {}

http {
    limit_req_zone $binary_remote_addr zone=api_limit:10m rate=10r/s;

    # Shared proxy headers, so upstreams see the real client and scheme.
    proxy_set_header Host              $host;
    proxy_set_header X-Real-IP         $remote_addr;
    proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;

    server {
        listen 80;
        server_name _;

        # Frontend static files
        location / {
            proxy_pass http://frontend:80;
        }

        # Backend API, rate-limited. The trailing slash strips the /api prefix,
        # so /api/categories reaches the backend as /categories. The frontend
        # detects this path automatically when served from port 80/443.
        location /api/ {
            limit_req zone=api_limit burst=20 nodelay;
            proxy_pass http://backend:8000/;
        }

        # Swagger docs. /openapi.json must be proxied too — the docs page
        # fetches it from the site root, and without it Swagger renders empty.
        location /docs {
            proxy_pass http://backend:8000/docs;
        }
        location /redoc {
            proxy_pass http://backend:8000/redoc;
        }
        location = /openapi.json {
            proxy_pass http://backend:8000/openapi.json;
        }
    }

    # HTTPS server block — uncomment and point at real certs once you have
    # a domain + SSL termination set up (Let's Encrypt / certbot recommended).
    #
    # server {
    #     listen 443 ssl;
    #     server_name your-domain.com;
    #     ssl_certificate     /etc/nginx/ssl/fullchain.pem;
    #     ssl_certificate_key /etc/nginx/ssl/privkey.pem;
    #     ...
    # }
}
